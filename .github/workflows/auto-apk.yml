name: Generate APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    - name: Generate Debug Keystore and Build APK
      run: |
        echo "=== Сборка проекта Android ==="
        # Ensure debug keystore exists in workspace root
        if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
          echo "Генерация debug.keystore..."
          keytool -genkey -v -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        
        gradle :app:assembleDebug --stacktrace --no-daemon
        
        mkdir -p $GITHUB_WORKSPACE/output_apk
        APK_PATH=$(find . -name "*debug*.apk" -o -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
          echo "Ошибка: APK файл не найден после сборки!"
          exit 1
        fi
        echo "Найден скомпилированный APK: $APK_PATH"
        cp "$APK_PATH" $GITHUB_WORKSPACE/output_apk/ZterOS-debug.apk

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: ZterOS-Debug-APK
        path: output_apk/ZterOS-debug.apk
        retention-days: 14
